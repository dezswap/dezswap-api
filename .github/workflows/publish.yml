name: Publish API/Indexer

on:
  workflow_call:
    inputs:
      app_type:
        required: true
        type: string
    secrets:
      # AWS
      AWS_REGION:
        required: true
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_SESSION_NAME:
        required: true
      ECR_REPOSITORY:
        required: true
      # GCP
      GCP_GAR_REPOSITORY:
        required: true
      GCP_REGION:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT_EMAIL:
        required: true
    outputs:
      image_tag:
        description: "The published image tag"
        value: ${{ jobs.build.outputs.tag }}
      ecr_push_ok:
        value: ${{ jobs.push_to_ecr.outputs.ecr_push_ok }}

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      run_next_job: ${{ steps.check_branch.outputs.run_next_job }}
      tag: ${{ steps.check_branch.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check if tag commit is on main branch
        id: check_branch
        run: |
          branches_containing_tag=$(git branch -r --contains ${{ github.ref }} --format "%(refname:lstrip=3)")
          echo "Branches containing tag: $branches_containing_tag"

          if echo "$branches_containing_tag" | grep -Eq "^(origin/)?main$"; then
            # get version from tag
            GIT_TAG=$(echo "${{ github.ref }}" | sed 's|refs/tags/v||')
            echo "tag=$GIT_TAG" >> $GITHUB_OUTPUT
            echo "run_next_job=true" >> $GITHUB_OUTPUT
          else
            echo "The tag commit is NOT on main branch. Exiting."
            echo "run_next_job=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build images
    needs: check_paths
    if: ${{ needs.check_paths.outputs.run_next_job == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.build-base-image.outputs.tag }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@fcca93e25c7fe3943de4d40c22d255d17f63e63b # ratchet:magnetikonline/action-golang-cache@v5
        with:
          go-version-file: go.mod

      - name: Generate bindings
        run: |
          go install github.com/ethereum/go-ethereum/cmd/abigen@v1.14.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make generate

      - name: Test, build and package base image
        id: build-base-image
        working-directory: .
        env:
          IMAGE_TAG: ${{ needs.check_paths.outputs.tag }}
        run: |
          # Build and package base image
          touch config.yml
          docker build --build-arg APP_TYPE=${{ inputs.app_type }} --build-arg APP_VERSION=$IMAGE_TAG -t dezswap-${{ inputs.app_type }}:$IMAGE_TAG .
          docker save -o ${{ runner.temp }}/dezswap-${{ inputs.app_type }}.tar dezswap-${{ inputs.app_type }}:$IMAGE_TAG
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: docker-images
          path: ${{ runner.temp }}/dezswap-${{ inputs.app_type }}.tar

  push_to_ecr:
    name: Push images to ECR
    needs: build
    environment: production
    runs-on: ubuntu-latest
    outputs:
      ecr_push_ok: ${{ steps.push-result.outputs.ecr_push_ok }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # ratchet:aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # ratchet:aws-actions/amazon-ecr-login@v2

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: docker-images
          path: ${{ runner.temp }}

      - name: Load, tag and push image to ECR
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker load -i ${{ runner.temp }}/dezswap-${{ inputs.app_type }}.tar
          docker tag dezswap-${{ inputs.app_type }}:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Set output success
        id: push-result
        run: |
          echo "ecr_push_ok=true" >> $GITHUB_OUTPUT

  push_to_gar:
    name: Push images to Google Artifact Registry
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3

      - name: Authenticate to Repo
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: docker-images
          path: ${{ runner.temp }}

      - name: Load, tag and push image to GAR
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          GCP_GAR_REPOSITORY: ${{ secrets.GCP_GAR_REPOSITORY }}
        run: |-
          docker load -i ${{ runner.temp }}/dezswap-${{ inputs.app_type }}.tar
          docker tag dezswap-${{ inputs.app_type }}:$IMAGE_TAG $GCP_GAR_REPOSITORY/dezswap-${{ inputs.app_type }}:$IMAGE_TAG
          docker push $GCP_GAR_REPOSITORY/dezswap-${{ inputs.app_type }}:$IMAGE_TAG
